# Trading Signal System Configuration

scanner:
  poll_interval_sec: 45
  sources:
    - reuters_rss
    - ap_rss
    - google_news_rss
    - defense_news_rss
    - sec_edgar
    - twitter
    - bloomberg

dedup:
  ttl_hours: 24

classifier:
  model: "gpt-4o"
  red_flag_magnitude: 3
  red_flag_confidence: 0.6
  yellow_flag_magnitude: 2

deepdive:
  lookback_days: 30
  volume_spike_threshold: 2.5
  volume_window_minutes: 30
  volume_poll_interval_sec: 60

technical:
  rsi_period: 14
  vwap_enabled: true
  atr_period: 14
  atr_stop_multiplier: 1.0
  entry_proximity_pct: 1.0

alert:
  primary_channel: telegram
  approval_timeout_sec: 300
  fallback_channel: sms

execution:
  broker: alpaca
  paper_trading: true

exit:
  trailing_stop_pct: 1.5
  scaled_exit_threshold_pct: 6.0
  scaled_exit_levels:
    - pct: 6.0
      sell_fraction: 0.5
    - pct: 8.0
      sell_fraction: 0.25
    - pct: 10.0
      sell_fraction: 1.0
  volume_divergence_candles: 3

time_decay:
  geopolitical_hours: 4
  earnings_surprise_hours: 48
  contract_win_hours: 72
  regulatory_shift_hours: 168

database:
  path: "data/trades.db"

logging:
  level: INFO
  json_output: true
